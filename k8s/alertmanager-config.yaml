apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: speedtest-line
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: line-webhook
    # alertname のみでグループ化することで、複数の失敗 Job が履歴に残っていても LINE 通知は 1 通にまとめる
    groupBy: ['alertname']
    groupWait: 10s
    groupInterval: 5m
    # 再通知は不要なため実質無効化（8760h = 1年）
    repeatInterval: 8760h
    matchers:
      - name: alertname
        matchType: =~
        value: "Speedtest.*"
  receivers:
    - name: line-webhook
      webhookConfigs:
        - url: "http://line-adapter.monitoring.svc.cluster.local:8080/webhook"
          sendResolved: true
