apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: speedtest-line
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: line-webhook
    # alertname のみでグループ化することで、複数の失敗 Job が履歴に残っていても LINE 通知は 1 通にまとめる
    groupBy: ['alertname']
    groupWait: 10s
    groupInterval: 5m
    # 失敗 Job は failedJobsHistoryLimit の間メトリクスに残り続けるため、再通知を抑制する
    repeatInterval: 12h
    matchers:
      - name: alertname
        value: SpeedtestJobFailed
  receivers:
    - name: line-webhook
      webhookConfigs:
        - url: "http://line-adapter.monitoring.svc.cluster.local:8080/webhook"
          sendResolved: true
