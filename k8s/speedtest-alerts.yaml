apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: speedtest-alerts
  namespace: monitoring
  labels:
    # Prometheus Operator が PrometheusRule を検出するために必要なラベル
    release: kube-prometheus-stack
spec:
  groups:
    - name: speedtest
      rules:
        # annotations は line-adapter が LINE 通知の本文として使う
        #   summary:     通知の見出し
        #   description: 何が起きているか
        #   action:      確認・対処方法（発生時のみ表示）
        - alert: SpeedtestJobFailed
          expr: |
            kube_job_status_failed{namespace="monitoring", job_name=~"speedtest-.*"} > 0
            and on(job_name)
            (time() - kube_job_created{namespace="monitoring", job_name=~"speedtest-.*"}) < 1800
          # 即時発火: Job 失敗から 30 分以内のみ Firing とし、Job 削除なしで自動解消する
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "速度計測ジョブが失敗しました"
            description: "{{ $labels.job_name }} が計測エラーまたはデータ送信エラーで失敗しました。"
            action: "kubectl logs -n monitoring job/{{ $labels.job_name }} でログを確認してください。この通知は Job の作成から 30 分経つと自動で解消されます（問題が直ったことを意味しません）。"

        - alert: SpeedtestDataStale
          expr: |
            (time() - push_time_seconds{job="speedtest", instance="raspi-cluster"}) / 3600 > 2
          # 即時発火: 30 分ごとの CronJob が 4 サイクル以上沈黙している状態を検知する
          # 通知文で経過時間を日本語の「時間」で表示するため、値は時間単位で返す
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "速度データが 2 時間以上更新されていません"
            description: "最後に計測できてから約 {{ printf \"%.1f\" $value }} 時間経過しています。"
            action: "Ookla のレート制限、CronJob の停止、Pushgateway の障害が考えられます。kubectl get jobs -n monitoring で直近の Job を確認してください。"

        - alert: SpeedtestLowDownloadSpeed
          expr: |
            speedtest_download_bits_per_second{job="speedtest", instance="raspi-cluster"} < 50000000
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "ダウンロード速度が 50 Mbps を下回っています"
            description: "計測値: {{ $value | humanize }}bps"
            action: "次回の計測（30 分後）でも続く場合は、回線やルーターの状態を確認してください。"

        - alert: SpeedtestLowUploadSpeed
          expr: |
            speedtest_upload_bits_per_second{job="speedtest", instance="raspi-cluster"} < 50000000
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "アップロード速度が 50 Mbps を下回っています"
            description: "計測値: {{ $value | humanize }}bps"
            action: "次回の計測（30 分後）でも続く場合は、回線やルーターの状態を確認してください。"
