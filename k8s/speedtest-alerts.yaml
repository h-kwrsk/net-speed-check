apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: speedtest-alerts
  namespace: monitoring
  labels:
    # Prometheus Operator が PrometheusRule を検出するために必要なラベル
    release: kube-prometheus-stack
spec:
  groups:
    - name: speedtest
      rules:
        - alert: SpeedtestJobFailed
          expr: |
            kube_job_status_failed{namespace="monitoring", job_name=~"speedtest-.*"} > 0
            and on(job_name)
            (time() - kube_job_created{namespace="monitoring", job_name=~"speedtest-.*"}) < 1800
          # 即時発火: Job 失敗から 30 分以内のみ Firing とし、Job 削除なしで自動解消する
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Speedtest job {{ $labels.job_name }} failed"
            description: "Speedtest CronJob で計測エラーが発生しました。\nJob: {{ $labels.job_name }}"
