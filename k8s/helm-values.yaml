grafana:
  # 組み込みダッシュボード（Node / Pod メトリクス等）のタイムゾーンを JST に設定
  defaultDashboardsTimezone: Asia/Tokyo
  grafana.ini:
    date_formats:
      default_timezone: Asia/Tokyo
  service:
    type: NodePort
    nodePort: 32000
  # ローリングアップデート時にゼロダウンタイムを保証する
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # local-path はノードローカルのため、PVC を作成したノードに固定する
  nodeSelector:
    kubernetes.io/hostname: raspi-worker2
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi
    accessModes:
      - ReadWriteOnce
