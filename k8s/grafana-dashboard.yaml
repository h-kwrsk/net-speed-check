apiVersion: v1
kind: ConfigMap
metadata:
  name: speedtest-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  speedtest-dashboard.json: |
    {
      "uid": "speedtest-dashboard",
      "title": "Internet Speed Test",
      "tags": ["speedtest", "network"],
      "timezone": "browser",
      "refresh": "5m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "graphTooltip": 1,
      "editable": true,
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Speed History",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0},
          "collapsed": false
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Download Speed",
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 1},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "color": {"mode": "fixed", "fixedColor": "blue"},
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "always",
                "pointSize": 5,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "tooltip": {"mode": "single"},
            "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "speedtest_download_bits_per_second{job=\"speedtest\", instance=\"raspi-cluster\"}",
              "legendFormat": "Download"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Upload Speed",
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 1},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "color": {"mode": "fixed", "fixedColor": "green"},
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "always",
                "pointSize": 5,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "tooltip": {"mode": "single"},
            "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "speedtest_upload_bits_per_second{job=\"speedtest\", instance=\"raspi-cluster\"}",
              "legendFormat": "Upload"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Ping Latency",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 1},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "color": {"mode": "fixed", "fixedColor": "orange"},
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "always",
                "pointSize": 5,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "tooltip": {"mode": "single"},
            "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "speedtest_ping_latency_milliseconds{job=\"speedtest\", instance=\"raspi-cluster\"}",
              "legendFormat": "Ping"
            }
          ]
        },
        {
          "id": 5,
          "type": "row",
          "title": "Current Values",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 9},
          "collapsed": false
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Latest Download",
          "gridPos": {"h": 4, "w": 8, "x": 0, "y": 10},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": 0},
                  {"color": "yellow", "value": 10000000},
                  {"color": "green", "value": 50000000}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "speedtest_download_bits_per_second{job=\"speedtest\", instance=\"raspi-cluster\"}",
              "legendFormat": "Download"
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Latest Upload",
          "gridPos": {"h": 4, "w": 8, "x": 8, "y": 10},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": 0},
                  {"color": "yellow", "value": 5000000},
                  {"color": "green", "value": 20000000}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "speedtest_upload_bits_per_second{job=\"speedtest\", instance=\"raspi-cluster\"}",
              "legendFormat": "Upload"
            }
          ]
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Latest Ping",
          "gridPos": {"h": 4, "w": 8, "x": 16, "y": 10},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": 0},
                  {"color": "yellow", "value": 50},
                  {"color": "red", "value": 100}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "speedtest_ping_latency_milliseconds{job=\"speedtest\", instance=\"raspi-cluster\"}",
              "legendFormat": "Ping"
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "pluginId": "prometheus",
            "label": "Data Source",
            "hide": 0,
            "refresh": 1,
            "query": "prometheus"
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {"type": "grafana", "uid": "-- Grafana --"},
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      }
    }
