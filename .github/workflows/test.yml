name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install speedtest-cli==2.1.3 prometheus-client==0.25.0 pytest

      - name: Run tests
        run: python -m pytest test_run.py -v
