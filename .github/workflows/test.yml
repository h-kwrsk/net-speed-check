name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r speedtest/requirements.txt
          pip install -r line-adapter/requirements.txt

      - name: Run tests (speedtest)
        run: python -m pytest speedtest/test_run.py -v

      - name: Run tests (line-adapter)
        run: python -m pytest line-adapter/test_app.py -v
